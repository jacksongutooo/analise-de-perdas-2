<style type="text/tailwindcss">
@theme inline {
  --font-sans: var(--font-plex), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@theme {
  /* Base clara e fria, navy como cor principal, verde discreto só para confirmações. */
  --color-paper: #f3f5f8;
  --color-surface: #ffffff;
  --color-ink: #0e2240;
  --color-ink-soft: #3a4658;
  --color-muted: #6a7585;
  --color-line: #dfe4eb;
  --color-line-strong: #c5ced9;

  --color-navy-50: #eef2f8;
  --color-navy-100: #dde5f1;
  --color-navy-600: #2a4a7b;
  --color-navy-700: #1f3a64;
  --color-navy-800: #172f52;
  --color-navy-900: #0e2240;

  --color-ok-50: #e9f5ee;
  --color-ok-600: #1e7f55;
  --color-ok-700: #176445;
  --color-warn-50: #fdf4e3;
  --color-warn-700: #875a10;
  --color-danger-50: #fcefee;
  --color-danger-700: #a3302a;

  --shadow-soft: 0 1px 2px rgb(14 34 64 / 0.04), 0 10px 28px -16px rgb(14 34 64 / 0.16);
}

@layer base {
  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection {
    background: var(--color-navy-100);
  }
  :focus-visible {
    outline: 2px solid var(--color-navy-600);
    outline-offset: 2px;
  }
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
}

@keyframes step-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.step-in {
  animation: step-in 0.28s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.fade-in {
  animation: fade-in 0.4s ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  .step-in,
  .fade-in {
    animation: none;
  }
  * {
    transition-duration: 0s !important;
  }
}

erline",children:"Pol\xEDtica de Privacidade"}),"."]}),(0,vt.jsxs)(Bt,{title:"1. O que \xE9 o servi\xE7o",children:[(0,vt.jsx)("p",{children:"Analisamos e acompanhamos individualmente a sua solicita\xE7\xE3o, a partir das informa\xE7\xF5es que voc\xEA informa no formul\xE1rio e dos documentos que a equipe pedir depois, para avaliar se existem elementos que permitam prosseguir com o seu caso. A an\xE1lise n\xE3o \xE9 garantia de resultado."}),(0,vt.jsx)(Un,{items:["Cada caso \xE9 analisado individualmente.","O resultado exibido ao fim do formul\xE1rio depende apenas das respostas informadas por voc\xEA: n\xE3o \xE9 uma consulta a bases de dados do governo ou das casas de apostas.","O envio das informa\xE7\xF5es n\xE3o garante recupera\xE7\xE3o, restitui\xE7\xE3o, indeniza\xE7\xE3o ou recebimento de valores.","A faixa de perda e os valores exibidos no acompanhamento (informado, identificado e validado) s\xE3o refer\xEAncias da an\xE1lise e n\xE3o representam valores a serem recuperados.","O servi\xE7o \xE9 oferecido de forma independente e n\xE3o \xE9 um servi\xE7o oficial ou governamental. As men\xE7\xF5es a medidas do Governo Federal para o setor de apostas s\xE3o informativas: o servi\xE7o n\xE3o tem v\xEDnculo com o governo e n\xE3o depende de iniciativas futuras."]})]}),(0,vt.jsx)(Bt,{title:"2. Quem pode usar",children:(0,vt.jsx)("p",{children:"O servi\xE7o \xE9 exclusivo para maiores de 18 anos, que informem dados sobre as pr\xF3prias contas em casas de apostas. A solicita\xE7\xE3o \xE9 feita uma \xFAnica vez por CPF: o servi\xE7o \xE9 para quem nunca pediu o estorno dessas perdas. Voc\xEA se compromete a fornecer informa\xE7\xF5es verdadeiras e documentos aut\xEAnticos, e a n\xE3o enviar dados de terceiros al\xE9m do estritamente necess\xE1rio."})}),(0,vt.jsx)(Bt,{title:"3. Documenta\xE7\xE3o",children:(0,vt.jsx)(Un,{items:["Para come\xE7ar, n\xE3o \xE9 preciso enviar documentos: voc\xEA informa se j\xE1 pediu o estorno, as casas de apostas, o per\xEDodo e a faixa de perda.","Depois do pagamento, a equipe entra em contato para verificar quais documentos s\xE3o necess\xE1rios para prosseguir, como o extrato banc\xE1rio com os PIX para as casas de apostas ou o ComprovaBet. Os documentos s\xE3o enviados pelo acompanhamento, com o protocolo e o e-mail da solicita\xE7\xE3o.","Os documentos devem estar em nome do pr\xF3prio solicitante e corresponder ao CPF informado. Quando poss\xEDvel, o CPF do documento \xE9 conferido automaticamente; nos demais casos, a confer\xEAncia \xE9 feita pela equipe.",Hi,"O CPF n\xE3o pode ser alterado depois que a an\xE1lise documental estiver em andamento."]})}),(0,vt.jsxs)(Bt,{title:"4. Pagamento da taxa",children:[(0,vt.jsx)("p",{children:an}),(0,vt.jsx)(Un,{items:["O pagamento \xE9 feito ao final do formul\xE1rio, depois do resultado e antes do registro da solicita\xE7\xE3o. A solicita\xE7\xE3o s\xF3 \xE9 registrada com a confirma\xE7\xE3o do pagamento.","O pagamento \xE9 feito por PIX: o QR Code e o c\xF3digo copia e cola aparecem na pr\xF3pria tela de pagamento, e o pagamento \xE9 feito no aplicativo do seu banco. A cobran\xE7a \xE9 processada pela BlackCat, e a confirma\xE7\xE3o do pagamento \xE9 autom\xE1tica. O site n\xE3o recebe dados banc\xE1rios.","Antes do pagamento, voc\xEA declara que as informa\xE7\xF5es s\xE3o verdadeiras, que o CPF informado \xE9 seu e que nunca solicitou o estorno dessas perdas antes. O aceite \xE9 registrado com data, hora e a vers\xE3o destas condi\xE7\xF5es.","O valor corresponde ao servi\xE7o de an\xE1lise e acompanhamento e n\xE3o depende do resultado da an\xE1lise.","Por se tratar de contrata\xE7\xE3o pela internet, voc\xEA pode desistir em at\xE9 7 (sete) dias da contrata\xE7\xE3o, nos termos do art. 49 do C\xF3digo de Defesa do Consumidor, pelos canais de atendimento informados no site."]})]}),(0,vt.jsx)(Bt,{title:"5. Prazos",children:(0,vt.jsx)(Un,{items:["Primeiro contato: em at\xE9 1 dia \xFAtil depois da confirma\xE7\xE3o do pagamento, pelo canal (WhatsApp, liga\xE7\xE3o ou e-mail) e no hor\xE1rio que voc\xEA preferir, para verificar os documentos necess\xE1rios.",`Resultado da an\xE1lise: em at\xE9 ${q.reviewDays} dias \xFAteis a partir do registro da solicita\xE7\xE3o, a equipe entra em contato pelo WhatsApp ou e-mail informados para apresentar o resultado e, se o caso puder prosseguir, combinar as condi\xE7\xF5es e as formas de pagamento das pr\xF3ximas etapas. A an\xE1lise depende do recebimento dos documentos pedidos, e o prazo pode ser ajustado quando eles chegam depois.`,"N\xE3o contam como dias \xFAteis s\xE1bados, domingos, feriados nacionais, Carnaval e Corpus Christi."]})}),(0,vt.jsx)(Bt,{title:"6. Autoexclus\xE3o",children:(0,vt.jsx)("p",{children:"Este servi\xE7o n\xE3o bloqueia contas nem impede novas apostas. Para um bloqueio efetivo, existe a autoexclus\xE3o oficial do Governo Federal, dispon\xEDvel em gov.br/autoexclusaoapostas, que n\xE3o tem rela\xE7\xE3o com este servi\xE7o. Solicita\xE7\xF5es anteriores podem ter inclu\xEDdo um compromisso volunt\xE1rio de n\xE3o apostar durante a an\xE1lise: esse compromisso \xE9 pessoal, n\xE3o representa bloqueio t\xE9cnico das contas e o seu cumprimento n\xE3o garante aprova\xE7\xE3o ou recupera\xE7\xE3o de valores."})}),(0,vt.jsx)(Bt,{title:"7. Seguran\xE7a e comunica\xE7\xE3o",children:(0,vt.jsx)("p",{children:"Nunca solicitaremos sua senha da plataforma, senha banc\xE1ria, c\xF3digo SMS ou c\xF3digo de autentica\xE7\xE3o. Se algu\xE9m pedir esses dados em nosso nome, n\xE3o informe e comunique-nos. O acompanhamento do caso \xE9 feito com o protocolo e o e-mail informados na solicita\xE7\xE3o; mantenha esses dados em sigilo."})}),(0,vt.jsx)(Bt,{title:"8. Responsabilidades",children:(0,vt.jsx)(Un,{items:["Voc\xEA \xE9 respons\xE1vel pela veracidade das informa\xE7\xF5es e pela autenticidade dos documentos enviados.","Podemos recusar ou encerrar solicita\xE7\xF5es com ind\xEDcios de fraude, dados falsos, documentos de terceiros ou uso indevido do servi\x
