<style type="text/tailwindcss">
@theme inline {
  --font-sans: var(--font-plex), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@theme {
  /* Base clara e fria, navy como cor principal, verde discreto só para confirmações. */
  --color-paper: #f3f5f8;
  --color-surface: #ffffff;
  --color-ink: #0e2240;
  --color-ink-soft: #3a4658;
  --color-muted: #6a7585;
  --color-line: #dfe4eb;
  --color-line-strong: #c5ced9;

  --color-navy-50: #eef2f8;
  --color-navy-100: #dde5f1;
  --color-navy-600: #2a4a7b;
  --color-navy-700: #1f3a64;
  --color-navy-800: #172f52;
  --color-navy-900: #0e2240;

  --color-ok-50: #e9f5ee;
  --color-ok-600: #1e7f55;
  --color-ok-700: #176445;
  --color-warn-50: #fdf4e3;
  --color-warn-700: #875a10;
  --color-danger-50: #fcefee;
  --color-danger-700: #a3302a;

  --shadow-soft: 0 1px 2px rgb(14 34 64 / 0.04), 0 10px 28px -16px rgb(14 34 64 / 0.16);
}

@layer base {
  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection {
    background: var(--color-navy-100);
  }
  :focus-visible {
    outline: 2px solid var(--color-navy-600);
    outline-offset: 2px;
  }
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
}

@keyframes step-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.step-in {
  animation: step-in 0.28s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.fade-in {
  animation: fade-in 0.4s ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  .step-in,
  .fade-in {
    animation: none;
  }
  * {
    transition-duration: 0s !important;
  }
}

vers\xE3o ${$a}`,children:[(0,bt.jsxs)("p",{children:["Estes termos regulam o uso do site de ",e,Ye.cnpj?` (CNPJ ${Ye.cnpj})`:""," para solicitar a an\xE1lise documental de perdas em apostas online. Ao enviar uma solicita\xE7\xE3o, voc\xEA declara que leu e concorda com estes termos e com a"," ",(0,bt.jsx)(he,{href:"/privacidade",className:"font-medium text-navy-700 underline",children:"Pol\xEDtica de Privacidade"}),"."]}),(0,bt.jsxs)(jt,{title:"1. O que \xE9 o servi\xE7o",children:[(0,bt.jsx)("p",{children:"Realizamos uma an\xE1lise documental individual das informa\xE7\xF5es e dos documentos enviados por voc\xEA, para avaliar se existem elementos que permitam prosseguir com o seu caso. A an\xE1lise n\xE3o \xE9 garantia de resultado."}),(0,bt.jsx)(rs,{items:["Cada caso \xE9 analisado individualmente.","O envio das informa\xE7\xF5es n\xE3o garante recupera\xE7\xE3o, restitui\xE7\xE3o, indeniza\xE7\xE3o ou recebimento de valores.","Os valores exibidos no acompanhamento (declarado, identificado e validado) s\xE3o refer\xEAncias da an\xE1lise documental e n\xE3o representam valores a serem recuperados.","O servi\xE7o \xE9 oferecido de forma independente e n\xE3o \xE9 um servi\xE7o oficial ou governamental."]})]}),(0,bt.jsx)(jt,{title:"2. Quem pode usar",children:(0,bt.jsx)("p",{children:"O servi\xE7o \xE9 exclusivo para maiores de 18 anos, que enviem informa\xE7\xF5es sobre as pr\xF3prias contas em plataformas de apostas. Voc\xEA se compromete a fornecer informa\xE7\xF5es verdadeiras e documentos aut\xEAnticos, e a n\xE3o enviar dados de terceiros al\xE9m do estritamente necess\xE1rio."})}),(0,bt.jsx)(jt,{title:"3. Documenta\xE7\xE3o",children:(0,bt.jsx)(rs,{items:[`O documento principal da an\xE1lise \xE9 o ComprovaBet anual referente a ${t}.`,"O ComprovaBet deve estar em nome do pr\xF3prio solicitante e corresponder ao CPF informado no cadastro. Quando poss\xEDvel, o CPF do documento \xE9 conferido automaticamente; nos demais casos, a confer\xEAncia \xE9 feita pela equipe.","Logo depois do envio, o ComprovaBet passa por uma pr\xE9-an\xE1lise autom\xE1tica: a leitura do PDF confere o CPF, o ano de refer\xEAncia e o tipo do documento, e compara as plataformas e os valores com as informa\xE7\xF5es do formul\xE1rio. Quando essas confer\xEAncias s\xE3o confirmadas, o documento \xE9 aprovado na pr\xE9-an\xE1lise; quando a leitura autom\xE1tica n\xE3o \xE9 poss\xEDvel (por exemplo, foto ou PDF digitalizado), a confer\xEAncia \xE9 feita pela equipe. Documento de outro ano ou de outro CPF precisa ser substitu\xEDdo antes do pagamento.","A pr\xE9-an\xE1lise autom\xE1tica confere o documento, n\xE3o o resultado do caso. Se o ComprovaBet estiver completo e consistente, n\xE3o ser\xE3o pedidos outros documentos naquele momento. Havendo informa\xE7\xE3o faltante ou inconsist\xEAncia, a equipe poder\xE1 solicitar documentos complementares.","O CPF n\xE3o pode ser alterado depois que a an\xE1lise documental estiver em andamento."]})}),(0,bt.jsxs)(jt,{title:"4. Pagamento da an\xE1lise",children:[(0,bt.jsx)("p",{children:Dn}),(0,bt.jsx)(rs,{items:["O pagamento \xE9 feito ao final do formul\xE1rio, depois da revis\xE3o das informa\xE7\xF5es e antes do envio da solicita\xE7\xE3o. A solicita\xE7\xE3o s\xF3 \xE9 registrada com a confirma\xE7\xE3o do pagamento.","O pagamento \xE9 feito por PIX: o QR Code e o c\xF3digo copia e cola aparecem na pr\xF3pria tela de pagamento, e o pagamento \xE9 feito no aplicativo do seu banco. A cobran\xE7a \xE9 processada pela BlackCat, e a confirma\xE7\xE3o do pagamento \xE9 autom\xE1tica. O site n\xE3o recebe dados banc\xE1rios.","Antes do pagamento, voc\xEA declara que as informa\xE7\xF5es e os documentos enviados s\xE3o verdadeiros e pertencem ao solicitante cadastrado. O aceite \xE9 registrado com data, hora e a vers\xE3o destas condi\xE7\xF5es.","O valor corresponde ao servi\xE7o de an\xE1lise documental e n\xE3o depende do resultado da an\xE1lise.","Por se tratar de contrata\xE7\xE3o pela internet, voc\xEA pode
